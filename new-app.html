<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7fb"><title>PGM FITNESS — New App</title><link rel="stylesheet" href="new-app.css"><script src="firebase-config.js"></script></head>
<body><main class="shell"><header><div><small>PGM FITNESS</small><h1>Management</h1></div><button id="logout" class="quiet" hidden>Sign out</button></header>
<section id="login" class="panel login"><h2>Owner Login</h2><p>പുതിയ Cloud App — Development preview</p><form id="loginForm"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Login</button></form><p id="loginStatus" role="status"></p></section>
<section id="app" hidden><nav><button class="tab active" data-tab="overview">Overview</button><button class="tab" data-tab="members">Members</button></nav>
<section id="overview" class="view"><div class="stats"><article><span>Total Members</span><strong id="totalMembers">—</strong></article><article><span>Active</span><strong id="activeMembers">—</strong></article><article><span>Expired</span><strong id="expiredMembers">—</strong></article><article><span>Balance Due</span><strong id="dueMembers">—</strong></article></div><p class="hint">പുതിയ App-ലെ കണക്കുകൾ Cloud Members രേഖകളിൽ നിന്നാണ്. പഴയ Dashboard ഡാറ്റ മാറ്റില്ല.</p></section>
<section id="members" class="view" hidden><div class="section-head"><h2>Members</h2><button id="addMember">+ Add Member</button></div><input id="search" class="search" placeholder="Search name or phone"><div id="memberList"></div></section></section></main>
<dialog id="memberDialog"><form id="memberForm" method="dialog"><h2 id="formTitle">Add Member</h2><input name="id" type="hidden"><label>Full name *<input name="name" required maxlength="120"></label><label>Phone<input name="phone" type="tel"></label><label>Address<input name="address"></label><label>Gender<select name="gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></label><label>Join date<input name="joinDate" type="date"></label><label>Plan<input name="plan" placeholder="Monthly / Quarterly"></label><label>Plan fee (₹)<input name="planFee" type="number" min="0" step="0.01"></label><label>Expiry date<input name="expiryDate" type="date"></label><label>Status<select name="status"><option value="active">Active</option><option value="inactive">Inactive</option></select></label><label>Notes<textarea name="notes" rows="2"></textarea></label><div class="actions"><button type="button" id="cancelForm" class="quiet">Cancel</button><button type="submit">Save Member</button></div></form></dialog><script type="module" src="new-app.js"></script></body></html>
