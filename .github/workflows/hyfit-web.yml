name: Deploy HYFIT iPhone Web App
on:
  push:
    branches: [hyfit-app]
    paths:
      - 'new-app.html'
      - 'new-app.js'
      - 'new-app.css'
      - 'firebase-config.js'
      - 'firebase-client.js'
      - 'auth-policy.js'
      - 'cloud-data.js'
      - 'access-policy.js'
      - 'staff-management-policy.js'
      - 'cloud-data-policy.js'
      - 'balance-calculator.js'
      - 'supabase-storage.js'
      - 'migration-runner.js'
      - 'migration-plan.js'
      - 'migration-preview.js'
      - 'migration-safety.js'
      - 'migration-verification.js'
      - 'backup-validation.js'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'hyfit-logo.svg'
      - 'icons/**'
      - '.github/workflows/hyfit-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hyfit-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HYFIT
        uses: actions/checkout@v4
        with:
          ref: hyfit-app
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run app logic tests
        run: |
          npm install
          npm run test:migration
      - name: Build static iPhone web app
        run: |
          python3 -m pip install Pillow cairosvg
          cairosvg hyfit-logo.svg -o logo.png -s 1
          mkdir -p site/icons
          cp new-app.html site/new-app.html
          cp new-app.html site/index.html
          cp new-app.css new-app.js firebase-config.js firebase-client.js auth-policy.js cloud-data.js access-policy.js staff-management-policy.js cloud-data-policy.js balance-calculator.js supabase-storage.js migration-runner.js migration-plan.js migration-preview.js migration-safety.js migration-verification.js backup-validation.js manifest.webmanifest service-worker.js logo.png site/
          cp icons/icon.svg site/icons/icon.svg
          touch site/.nojekyll
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy HYFIT to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
