name: Build Android APK
on:
  push:
    branches:
      - firebase-login-development
    paths:
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'icons/**'
      - '.github/workflows/pwa-pages.yml'
      - 'logo.png'
      - 'new-app.html'
      - 'new-app.js'
      - 'new-app.css'
      - 'firebase-config.js'
      - 'firebase-client.js'
      - 'auth-policy.js'
      - 'cloud-data.js'
      - 'access-policy.js'
      - 'staff-management-policy.js'
      - 'cloud-data-policy.js'
      - 'balance-calculator.js'
      - 'supabase-storage.js'
      - 'migration-runner.js'
      - 'migration-plan.js'
      - 'migration-preview.js'
      - 'migration-safety.js'
      - 'migration-verification.js'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: firebase-login-development
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare bundled app
        run: |
          mkdir -p www
          mkdir -p www/icons
          cp new-app.html www/index.html
          cp logo.png www/logo.png
          cp manifest.webmanifest service-worker.js www/
          cp icons/icon.svg www/icons/
          cp logo.png www/
          cp new-app.js new-app.css firebase-config.js firebase-client.js auth-policy.js cloud-data.js access-policy.js staff-management-policy.js cloud-data-policy.js balance-calculator.js supabase-storage.js migration-runner.js migration-plan.js migration-preview.js migration-safety.js migration-verification.js www/
      - name: Install dependencies
        run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: Install icon image tool
        run: python3 -m pip install Pillow
      - name: Apply PGM Fitness launcher icon
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          src = Image.open("logo.png").convert("RGBA")
          sizes = {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
          foreground_sizes = {"mdpi":108,"hdpi":162,"xhdpi":216,"xxhdpi":324,"xxxhdpi":432}
          for density, size in sizes.items():
              folder = Path(f"android/app/src/main/res/mipmap-{density}")
              folder.mkdir(parents=True, exist_ok=True)
              canvas = Image.new("RGBA", (size,size), (255,255,255,0))
              image = ImageOps.contain(src, (int(size*.82),int(size*.82)), Image.Resampling.LANCZOS)
              canvas.alpha_composite(image, ((size-image.width)//2,(size-image.height)//2))
              canvas.save(folder/"ic_launcher.png")
              canvas.save(folder/"ic_launcher_round.png")
              fsize = foreground_sizes[density]
              foreground = Image.new("RGBA", (fsize,fsize), (0,0,0,0))
              mark = ImageOps.contain(src, (int(fsize*.68),int(fsize*.68)), Image.Resampling.LANCZOS)
              foreground.alpha_composite(mark, ((fsize-mark.width)//2,(fsize-mark.height)//2))
              foreground.save(folder/"ic_launcher_foreground.png")
          res = Path("android/app/src/main/res")
          adaptive = res/"mipmap-anydpi-v26"
          adaptive.mkdir(parents=True, exist_ok=True)
          icon_xml = '''<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>'''
          (adaptive/"ic_launcher.xml").write_text(icon_xml)
          (adaptive/"ic_launcher_round.xml").write_text(icon_xml)
          values = res/"values"
          values.mkdir(parents=True, exist_ok=True)
          (values/"ic_launcher_background.xml").write_text('''<resources><color name="ic_launcher_background">#FFFFFF</color></resources>''')
          PY
      - name: Configure persistent APK signing
        env:
          PGM_KEYSTORE_BASE64: ${{ secrets.PGM_KEYSTORE_BASE64 }}
          PGM_KEYSTORE_PASSWORD: ${{ secrets.PGM_KEYSTORE_PASSWORD }}
          PGM_KEY_ALIAS: ${{ secrets.PGM_KEY_ALIAS }}
          PGM_KEY_PASSWORD: ${{ secrets.PGM_KEY_PASSWORD }}
        run: |
          test -n "$PGM_KEYSTORE_BASE64" || (echo "Missing PGM_KEYSTORE_BASE64 repository secret" && exit 1)
          test -n "$PGM_KEYSTORE_PASSWORD" || (echo "Missing PGM_KEYSTORE_PASSWORD repository secret" && exit 1)
          test -n "$PGM_KEY_ALIAS" || (echo "Missing PGM_KEY_ALIAS repository secret" && exit 1)
          test -n "$PGM_KEY_PASSWORD" || (echo "Missing PGM_KEY_PASSWORD repository secret" && exit 1)
          echo "$PGM_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pgm-fitness-upload.jks"
          echo "PGM_KEYSTORE_PATH=$RUNNER_TEMP/pgm-fitness-upload.jks" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("android/app/build.gradle")
          text = gradle.read_text()
          signing = """
          android {
              signingConfigs {
                  debug {
                      storeFile file(System.getenv("PGM_KEYSTORE_PATH"))
                      storePassword System.getenv("PGM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("PGM_KEY_ALIAS")
                      keyPassword System.getenv("PGM_KEY_PASSWORD")
                  }
              }
          }
          """
          gradle.write_text(text + "\n" + signing)
          PY
      - name: Build debug APK
        env:
          PGM_KEYSTORE_PASSWORD: ${{ secrets.PGM_KEYSTORE_PASSWORD }}
          PGM_KEY_ALIAS: ${{ secrets.PGM_KEY_ALIAS }}
          PGM_KEY_PASSWORD: ${{ secrets.PGM_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: pgm-fitness-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
