name: Build HYFIT Android APK
on:
  push:
    branches: [hyfit-app]
    paths:
      - 'manifest.webmanifest'
      - 'icons/**'
      - 'logo.png'
      - 'new-app.html'
      - 'new-app.js'
      - 'new-app.css'
      - 'firebase-config.js'
      - 'firebase-client.js'
      - 'auth-policy.js'
      - 'cloud-data.js'
      - 'access-policy.js'
      - 'staff-management-policy.js'
      - 'cloud-data-policy.js'
      - 'balance-calculator.js'
      - 'supabase-storage.js'
      - 'migration-runner.js'
      - 'migration-plan.js'
      - 'migration-preview.js'
      - 'migration-safety.js'
      - 'migration-verification.js'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/hyfit-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hyfit-app
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install test dependencies
        run: npm install
      - name: Run HYFIT migration and access tests
        run: npm run test:migration
      - name: Run Firestore security rules tests
        run: npm run test:rules

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hyfit-app
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify HYFIT Firebase configuration
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = fs.readFileSync('firebase-config.js', 'utf8');
          const rules = fs.readFileSync('firestore.rules', 'utf8');
          const storage = fs.readFileSync('storage.rules', 'utf8');
          if (!config.includes('hyfit-a6f68')) throw new Error('HYFIT Firebase project config missing');
          if (config.includes('pgmfitness-5e107')) throw new Error('PGM Firebase config must never be used in HYFIT');
          if (config.includes('window.PGM_FIREBASE_CONFIG = null')) throw new Error('Firebase config is empty');
          if (!config.match(/window\\.PGM_OWNER_UID\\s*=\\s*["'][^"']+["']/)) throw new Error('HYFIT Owner UID missing');
          if (rules.includes('HYFIT_OWNER_UID_REPLACE_BEFORE_DEPLOY') || storage.includes('HYFIT_OWNER_UID_REPLACE_BEFORE_DEPLOY')) throw new Error('Owner UID placeholder remains');
          NODE
      - name: Prepare HYFIT web bundle
        run: |
          mkdir -p www/icons
          cp new-app.html www/index.html
          cp logo.png www/logo.png
          cp manifest.webmanifest service-worker.js www/
          cp icons/icon.svg www/icons/
          cp new-app.js new-app.css firebase-config.js firebase-client.js auth-policy.js cloud-data.js access-policy.js staff-management-policy.js cloud-data-policy.js balance-calculator.js supabase-storage.js migration-runner.js migration-plan.js migration-preview.js migration-safety.js migration-verification.js www/
      - name: Install app dependencies
        run: npm install
      - name: Generate Android project
        run: npx cap add android
      - name: Apply HYFIT launcher label and supplied logo
        run: |
          python3 -m pip install Pillow
          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          src=Image.open("logo.png").convert("RGBA")
          sizes={"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
          for density,size in sizes.items():
            folder=Path(f"android/app/src/main/res/mipmap-{density}")
            folder.mkdir(parents=True,exist_ok=True)
            canvas=Image.new("RGBA",(size,size),(0,0,0,255))
            mark=ImageOps.contain(src,(int(size*.82),int(size*.82)),Image.Resampling.LANCZOS)
            canvas.alpha_composite(mark,((size-mark.width)//2,(size-mark.height)//2))
            canvas.save(folder/"ic_launcher.png")
            canvas.save(folder/"ic_launcher_round.png")
          PY
      - name: Build Android debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HYFIT-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Build Android release APK
        run: |
          cd android
          ./gradlew assembleRelease
      - name: Sign release APK with persistent key when configured
        id: sign_release
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.HYFIT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HYFIT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HYFIT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HYFIT_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Persistent signing secrets are not configured; no final release APK will be published."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/hyfit-release.jks"
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/hyfit-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out android/app/build/outputs/apk/release/HYFIT-release.apk "$APK"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose android/app/build/outputs/apk/release/HYFIT-release.apk
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Upload signed final release APK
        if: steps.sign_release.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: HYFIT-Final-APK
          path: android/app/build/outputs/apk/release/HYFIT-release.apk
          if-no-files-found: error
          retention-days: 30
